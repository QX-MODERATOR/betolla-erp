plugins {
    id 'com.android.application'
}

// Push notifications (Firebase Cloud Messaging) need android/app/google-services.json. It is not
// committed (public repo): CI writes it from the GOOGLE_SERVICES_JSON secret. Without it the app
// still builds and runs, only without push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('android/app/google-services.json is missing: this APK will not receive push notifications.')
}

// Release signing is never hard-coded. It comes from environment variables (CI secrets)
// or from android/keystore.properties (local only, git-ignored):
//   storeFile=release.keystore   (relative to android/app, or absolute)
//   storePassword=...  keyAlias=...  keyPassword=...
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName -> System.getenv(envName) ?: keystoreProps.getProperty(propName) }
def releaseStorePath = signingValue('ANDROID_KEYSTORE_FILE', 'storeFile')
def hasReleaseSigning = releaseStorePath && file(releaseStorePath).exists() &&
    signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword') &&
    signingValue('ANDROID_KEY_ALIAS', 'keyAlias') &&
    signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
if (!hasReleaseSigning) {
    logger.warn('No release keystore configured: the release APK will be signed with the debug key ' +
        '(installable for testing, but it cannot update an app installed from the official release key).')
}

android {
    namespace 'com.betolla.erp'
    compileSdk 34

    defaultConfig {
        applicationId "com.betolla.erp"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "2.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Same key as release when available, so debug builds can update an installed release.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}
